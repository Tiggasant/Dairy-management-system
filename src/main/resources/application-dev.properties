# Local development only: run with SPRING_PROFILES_ACTIVE=dev
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/dairy_management}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
management.endpoint.health.show-details=always
# Obvious dev-only secret. Production MUST set JWT_SECRET.
app.jwt.secret=${JWT_SECRET:dev-only-secret-change-me-0123456789abcdef}
app.bootstrap.owner.username=${BOOTSTRAP_OWNER_USERNAME:owner}
app.bootstrap.owner.password=${BOOTSTRAP_OWNER_PASSWORD:Owner@12345}
