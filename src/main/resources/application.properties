spring.application.name=dairy-management
server.port=${PORT:8080}
# Set to "native" when running behind nginx / a load balancer (real client IP for login throttling)
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Never leak internals in error responses (GlobalExceptionHandler builds the body)
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# ---- Database (all required: the app refuses to start if one is missing) ----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# Flyway owns the schema, Hibernate only validates that entities match it
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_batch_fetch_size=32

# ---- Actuator: only health is exposed, no details ----
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# ---- Application ----
app.timezone=${APP_TIMEZONE:Asia/Kolkata}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:720}
app.jwt.issuer=ghunsai-dairy
# Comma separated list. Leave empty when only a mobile app / same-origin client is used.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
# Optional: creates the first OWNER on startup if no owner exists yet.
app.bootstrap.owner.username=${BOOTSTRAP_OWNER_USERNAME:}
app.bootstrap.owner.password=${BOOTSTRAP_OWNER_PASSWORD:}
app.bootstrap.owner.full-name=${BOOTSTRAP_OWNER_NAME:Owner}

